name: Build sandbox image

on:
  push:
    branches: [master]
    paths:
      - 'containers/**'
      - '.github/workflows/build-sandbox.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

permissions:
  contents: read
  packages: write

concurrency:
  # The Kali image is slow to build; never run two at once for the same ref.
  group: sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      # GITHUB_TOKEN with packages: write is enough for GHCR — no secret needed.
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          # A push to containers/** republishes the tag the CLI currently
          # defaults to, so the image and the default never drift apart.
          if [[ -z "$TAG" ]]; then
            TAG=$(grep -oP 'strix-sandbox:\K[^"]+' strix/config/settings.py | head -1)
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::could not resolve a sandbox image tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Publishing ghcr.io/${{ github.repository_owner }}/strix-sandbox:${TAG}"

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          # The repository root: the Dockerfile COPYs both
          # containers/docker-entrypoint.sh and strix/tools/proxy/caido_api.py.
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/strix-sandbox:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/strix-sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
